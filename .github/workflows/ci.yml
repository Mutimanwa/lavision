name: lavision CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://lavision:lavision_ci@localhost:5432/lavision_test?schema=public
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: lavision
          POSTGRES_PASSWORD: lavision_ci
          POSTGRES_DB: lavision_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U lavision -d lavision_test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Initialize core, apply migrations and seed anonymous data
        env:
          LAVISION_SKIP_DOCKER: "true"
        run: npm run setup:local

      - name: Unit and contract tests
        run: npm test

      - name: PostgreSQL integration tests
        run: npm run test:integration

      - name: Check OpenAPI document
        run: npm run openapi:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build API and static web application
        run: npm run build

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: lavision-web
          path: apps/web/out/
          retention-days: 7

  build-windows:
    name: Windows Desktop
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri bundles
        run: npm run tauri build

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: lavision-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          retention-days: 14
