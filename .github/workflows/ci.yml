name: lavision CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://lavision:lavision_ci@localhost:5432/lavision_test?schema=public
      AUTH_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      AUTH_COOKIE_SECURE: "false"
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: lavision
          POSTGRES_PASSWORD: lavision_ci
          POSTGRES_DB: lavision_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U lavision -d lavision_test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Initialize core, apply migrations and seed anonymous data
        env:
          LAVISION_SKIP_DOCKER: "true"
        run: npm run setup:local

      - name: Unit and contract tests
        run: npm test

      - name: Deployment state, secret policy and configuration coverage tests
        run: npm run test:deployment && npm run check:secrets && npm run check:rules

      - name: PostgreSQL integration tests
        run: npm run test:integration

      - name: Check OpenAPI document
        run: npm run openapi:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Validate local and staging Compose definitions
        env:
          IMAGE_TAG: ci-${{ github.sha }}
          DATABASE_URL: postgresql://lavision:ci_staging_only@postgres:5432/lavision_staging?schema=public
          POSTGRES_PASSWORD: ci_staging_only
          AUTH_WEB_BASE_URL: https://staging.example.invalid
          SMTP_URL: smtp://example.invalid:1025
          AUTH_MAIL_FROM: lavision <no-reply@example.invalid>
          METRICS_TOKEN: ci_metrics_only
        run: |
          docker compose -f compose.yml config --quiet
          docker compose -f deploy/compose.staging.yml config --quiet

      - name: Build API and static web application
        run: npm run build

      - name: Smoke staging deployment and application rollback
        env:
          DATABASE_URL: postgresql://lavision:ci_staging_only@postgres:5432/lavision_staging?schema=public
          POSTGRES_PASSWORD: ci_staging_only
          AUTH_WEB_BASE_URL: https://staging.example.invalid
          SMTP_URL: smtp://example.invalid:1025
          AUTH_MAIL_FROM: lavision <no-reply@example.invalid>
          METRICS_TOKEN: ci_metrics_only
          WEB_PORT: 18080
          LOG_LEVEL: error
        run: |
          export IMAGE_TAG="ci-${GITHUB_SHA}-a"
          node scripts/deploy-staging.mjs deploy
          export IMAGE_TAG="ci-${GITHUB_SHA}-b"
          node scripts/deploy-staging.mjs deploy
          export ROLLBACK_CONFIRM=YES
          node scripts/deploy-staging.mjs rollback

          # Migration volontairement limitée au staging jetable : elle prouve
          # que le script refuse un rollback qui changerait de schéma.
          probe="apps/api/prisma/migrations/20261029230000_ci_rollback_guard"
          trap 'rm -rf "$probe"' EXIT
          mkdir -p "$probe"
          printf '%s\n' 'CREATE TABLE "ci_rollback_probe" ("id" INTEGER PRIMARY KEY);' > "$probe/migration.sql"
          export IMAGE_TAG="ci-${GITHUB_SHA}-c"
          node scripts/deploy-staging.mjs deploy
          if node scripts/deploy-staging.mjs rollback > /tmp/lavision-rollback-refusal.log 2>&1; then
            echo "Le rollback incompatible aurait dû être refusé."
            exit 1
          fi
          grep -q "ROLLBACK_BASE_REQUIRED" /tmp/lavision-rollback-refusal.log

      - name: Remove disposable staging environment
        if: always()
        continue-on-error: true
        env:
          IMAGE_TAG: ci-cleanup
          DATABASE_URL: postgresql://lavision:ci_staging_only@postgres:5432/lavision_staging?schema=public
          POSTGRES_PASSWORD: ci_staging_only
          AUTH_WEB_BASE_URL: https://staging.example.invalid
          SMTP_URL: smtp://example.invalid:1025
          AUTH_MAIL_FROM: lavision <no-reply@example.invalid>
          METRICS_TOKEN: ci_metrics_only
        run: docker compose -f deploy/compose.staging.yml down -v --remove-orphans

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: lavision-web
          path: apps/web/out/
          retention-days: 7

  build-windows:
    name: Windows Desktop
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri bundles
        run: npm run tauri build

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: lavision-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          retention-days: 14
