services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: lavision
      POSTGRES_PASSWORD: lavision_local
      POSTGRES_DB: lavision_local
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lavision -d lavision_local"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - lavision-postgres-local:/var/lib/postgresql/data

volumes:
  lavision-postgres-local:
