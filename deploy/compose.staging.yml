name: lavision-staging

x-api-environment: &api-environment
  NODE_ENV: production
  APP_ENV: staging
  APP_VERSION: ${APP_VERSION:-0.1.0}
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL est requis pour staging}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  PORT: 3001
  WORKER_PORT: 3002
  AUTH_ENCRYPTION_KEY: ${AUTH_ENCRYPTION_KEY:?AUTH_ENCRYPTION_KEY est requis pour staging}
  AUTH_COOKIE_SECURE: "true"
  AUTH_WEB_BASE_URL: ${AUTH_WEB_BASE_URL:?AUTH_WEB_BASE_URL est requis pour staging}
  SMTP_URL: ${SMTP_URL:?SMTP_URL est requis pour staging}
  AUTH_MAIL_FROM: ${AUTH_MAIL_FROM:?AUTH_MAIL_FROM est requis pour staging}
  METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN est requis pour staging}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  TRUST_PROXY: "true"

x-logging: &logging
  driver: json-file
  options:
    max-size: 25m
    max-file: "5"

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lavision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est requis pour staging}
      POSTGRES_DB: ${POSTGRES_DB:-lavision_staging}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - lavision-postgres-staging:/var/lib/postgresql/data
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - lavision-redis-staging:/data
    restart: unless-stopped
    logging: *logging

  migrate:
    image: lavision-migrate:${IMAGE_TAG:?IMAGE_TAG immutable est requis}
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL est requis pour staging}
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  api:
    image: lavision-api:${IMAGE_TAG:?IMAGE_TAG immutable est requis}
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 15s
    init: true
    restart: unless-stopped
    logging: *logging

  worker:
    image: lavision-worker:${IMAGE_TAG:?IMAGE_TAG immutable est requis}
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3002/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 15s
    init: true
    restart: unless-stopped
    logging: *logging

  web:
    image: lavision-web:${IMAGE_TAG:?IMAGE_TAG immutable est requis}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
    restart: unless-stopped
    logging: *logging

volumes:
  lavision-postgres-staging:
  lavision-redis-staging:
