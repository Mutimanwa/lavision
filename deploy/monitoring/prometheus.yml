global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: lavision-api
    metrics_path: /api/v1/metrics
    bearer_token_file: /run/secrets/lavision_metrics_token
    static_configs:
      - targets: ["api:3001"]

  - job_name: lavision-worker
    metrics_path: /metrics
    bearer_token_file: /run/secrets/lavision_metrics_token
    static_configs:
      - targets: ["worker:3002"]
